# 正式部署专用。请通过根目录 deploy.sh 使用，不要混用旧 docker-compose.yml。
name: ${COMPOSE_PROJECT_NAME:-ebook-site}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?数据库名称未配置}
      MYSQL_USER: ${MYSQL_USER:?数据库用户未配置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?数据库密码未配置}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?数据库管理员密码未配置}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  web:
    build:
      context: ..
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-书库}
      DEBUG: "false"
      PUBLIC_BASE_URL: https://${SITE_DOMAIN:?请先填写网站域名}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      SESSION_SECRET: ${SESSION_SECRET:?会话密钥未配置}
      SESSION_HTTPS_ONLY: "true"
      LOCAL_STORAGE_ROOT: /app/runtime
      DEFAULT_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?首次管理员密码未配置}
      ORGANIZER_SITE_ID: ${ORGANIZER_SITE_ID:?网站编号未配置}
      ORGANIZER_COVER_HOSTS: ${ORGANIZER_COVER_HOSTS:-}
      SITE_ALIASES: ${SITE_ALIASES:-}
      MAINTENANCE_CONTROL_ROOT: /app/control
      IMPORT_MAX_ROWS: "20000"
      IMPORT_MAX_BYTES: "20971520"
      LINK_CHECK_AUTOMATIC_ENABLED: ${LINK_CHECK_AUTOMATIC_ENABLED:-false}
      CLOUD_UPLOAD_WORKER_ENABLED: "false"
      CLOUD_UPLOAD_SOURCE_ROOTS: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_runtime:/app/runtime
      - cover_data:/app/app/static/covers
      - ./control/requests:/app/control/requests
      - ./control/status:/app/control/status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请先填写网站域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./domains:/etc/caddy/domains:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

volumes:
  mysql_data:
  app_runtime:
  cover_data:
  caddy_data:
  caddy_config:
