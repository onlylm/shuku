{% extends "admin/base.html" %}{% block title %}编辑友情链接{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">前台设置</p><h1>编辑“{{ link.name }}”</h1><p>修改后会立即同步到前台页脚。</p></div><a class="btn btn-secondary" href="{{ url_for('admin_friend_links') }}">返回链接列表</a></div>
<div class="form-layout"><form class="admin-card form-stack" action="{{ url_for('admin_friend_link_update', link_id=link.id) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><label class="field"><span>网站名称 <em class="required">*</em></span><input class="input" name="name" value="{{ link.name }}" required></label><label class="field"><span>链接地址 <em class="required">*</em></span><input class="input" name="url" value="{{ link.url }}" required></label><label class="field"><span>排序数字</span><input class="input" name="sort_order" type="number" value="{{ link.sort_order }}"><small class="hint">数字越小越靠前。</small></label><label class="field checkbox-field"><input type="checkbox" name="is_visible" value="1" {{ 'checked' if link.is_visible }}>在前台显示</label><button class="btn btn-primary">保存友情链接</button></form>
<aside class="side-stack"><section class="admin-card"><h2>删除链接</h2><p class="hint">删除后该链接会从页脚消失，且不可恢复。</p><form action="{{ url_for('admin_friend_link_delete', link_id=link.id) }}" method="post" onsubmit="return confirm('确认删除这条友情链接？')"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="btn btn-danger btn-block">删除友情链接</button></form></section></aside></div>
{% endblock %}
