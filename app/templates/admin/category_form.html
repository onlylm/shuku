{% extends "admin/base.html" %}{% block title %}编辑分类{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">分类设置</p><h1>编辑“{{ category.name }}”</h1><p>调整后会同步更新前台导航、分类页和资源详情页。</p></div><a class="btn btn-secondary" href="{{ url_for('admin_categories') }}">返回分类列表</a></div>
<div class="form-layout"><form class="admin-card form-stack" action="{{ url_for('admin_category_update', category_id=category.id) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><label class="field"><span>分类名称 <em class="required">*</em></span><input class="input" name="name" value="{{ category.name }}" required></label><label class="field"><span>网址别名</span><input class="input" name="slug" value="{{ category.slug }}" required></label><label class="field"><span>上级分类</span><select class="select" name="parent_id"><option value="">设为一级分类</option>{% for item in categories %}<option value="{{ item.id }}" {{ 'selected' if category.parent_id == item.id }}>{{ item.name }}</option>{% endfor %}</select></label><label class="field"><span>分类说明</span><textarea class="textarea" name="description" rows="4">{{ category.description or '' }}</textarea></label><label class="field"><span>排序数字</span><input class="input" name="sort_order" type="number" value="{{ category.sort_order }}"><small class="hint">数字越小越靠前。</small></label><label class="field checkbox-field"><input type="checkbox" name="is_visible" value="1" {{ 'checked' if category.is_visible }}>在前台显示</label><button class="btn btn-primary">保存分类设置</button></form>
<aside class="side-stack"><section class="admin-card"><h2>删除分类</h2><p class="hint">只有没有下级分类、也没有关联资源的空分类才允许删除。有关联内容时，可以先隐藏分类。</p><form action="{{ url_for('admin_category_delete', category_id=category.id) }}" method="post" onsubmit="return confirm('确认删除这个空分类？')"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="btn btn-danger btn-block">删除空分类</button></form></section></aside></div>
{% endblock %}
