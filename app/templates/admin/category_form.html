{% extends "admin/base.html" %}{% block title %}编辑分类{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">分类设置</p><h1>编辑“{{ category.name }}”</h1><p>调整后会同步更新前台导航、分类页和资源详情页。</p></div><a class="btn btn-secondary" href="{{ url_for('admin_categories') }}">返回分类列表</a></div>
<div class="form-layout"><form class="admin-card form-stack" action="{{ url_for('admin_category_update', category_id=category.id) }}" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
<label class="field"><span>分类名称 <em class="required">*</em></span><input class="input" name="name" value="{{ category.name }}" required maxlength="100"></label>
<label class="field"><span>网址别名</span><input class="input" name="slug" value="{{ category.slug }}" required><small class="hint">只改名称时请保留网址别名，以免旧分类地址失效。</small></label>
<label class="field"><span>上级分类</span><select class="select" name="parent_id" {{ 'disabled' if category.id in fixed_roots }}>
{% if not category.parent_id %}<option value="">{{ '固定顶部导航' if category.id in fixed_roots else '原一级分类（待整理）' }}</option>{% endif %}
{% for item in categories if not item.parent_id and (not fixed_roots or item.id in fixed_roots or item.id == category.parent_id) %}<option value="{{ item.id }}" {{ 'selected' if category.parent_id == item.id }}>{{ item.name }}</option>{% endfor %}
</select><small class="hint">移动二级分类时，会同时补齐关联图书的新上级分类；不会修改书名或下载链接。</small></label>
<label class="field"><span>分类说明</span><textarea class="textarea" name="description" rows="4">{{ category.description or '' }}</textarea></label>
<label class="field"><span>二级排序数字</span><input class="input" name="sort_order" type="number" value="{{ category.sort_order }}"><small class="hint">二级分类数字越小越靠前，固定顶部导航顺序不变。</small></label>
<label class="field checkbox-field"><input type="checkbox" name="is_visible" value="1" {{ 'checked' if category.is_visible }}>允许前台访问（隐藏后分类页也无法访问）</label>
<button class="btn btn-primary">保存分类设置</button></form>
<aside class="side-stack"><section class="admin-card"><h2>删除分类</h2><p class="hint">只有没有下级分类、也没有关联资源的空分类才允许删除。有关联内容时，可以先隐藏分类。</p><form action="{{ url_for('admin_category_delete', category_id=category.id) }}" method="post" onsubmit="return confirm('确认删除这个空分类？')"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="btn btn-danger btn-block">删除空分类</button></form></section></aside></div>
{% endblock %}
