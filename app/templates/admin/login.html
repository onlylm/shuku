<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>后台登录｜{{ app_name }}</title><link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml"><link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}"></head><body class="admin-body login-body"><main class="login-shell"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark"></span><span class="brand-name">{{ app_name }}</span></a><section class="admin-card login-card"><p class="eyebrow">后台入口</p><h1>管理后台</h1><p>仅供个人资源整理使用。</p>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form class="form-stack" action="{{ url_for('admin_login_submit') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label class="field"><span>用户名</span><input class="input" name="username" autocomplete="username" required autofocus></label><label class="field"><span>密码</span><input class="input" name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary btn-block">登录</button></form></section></main></body></html>
